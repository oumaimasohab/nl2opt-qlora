# QLoRA v2: identical to v1 except the training targets write share-of-total constraints as stated,
# bikes <= 0.3 * (bikes + scooters), instead of simplified, 0.7 * bikes - 0.3 * scooters <= 0
# (scripts/07_make_sft_data.py --ratio-style literal; 72 of 690 train examples differ).
# Run: uv run python scripts/train_with_peak.py --config configs/lora_v2.yaml
model: mlx-community/Qwen2.5-Coder-3B-Instruct-4bit
train: true
data: data/sft-v2              # same problems as data/sft; only the ratio-constraint style differs
adapter_path: adapters/v2
seed: 0

fine_tune_type: lora
num_layers: -1                 # all 36 layers
lora_parameters:
  rank: 16
  scale: 2.0                   # mlx scale multiplies the update directly; 2.0 = alpha 32 / rank 16
  dropout: 0.05
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj",
         "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]

optimizer: adamw
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 20
  warmup_init: 1.0e-6
  arguments: [1.0e-4, 500, 1.0e-6]   # peak, decay steps (after warm-up), final

batch_size: 4
iters: 520                     # ~3 epochs of 690 examples
max_seq_length: 1024           # longest example is 833 tokens
mask_prompt: true              # loss on the assistant answer only
grad_checkpoint: true          # needed: batch 4 x 36 layers ran out of GPU memory without it

steps_per_report: 10
steps_per_eval: 100
val_batches: -1                # full dev set for validation loss
save_every: 100                # checkpoints at 100..500, final adapter at 520

report_to: wandb
project_name: nl2opt-qlora
