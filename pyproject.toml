[project]
name = "nl2opt"
version = "0.1.0"
description = "Fine-tune Qwen2.5-Coder-3B (QLoRA, mlx-lm) to turn NL4Opt LP word problems into PuLP programs"
requires-python = ">=3.12"
dependencies = [
    "mlx==0.32.4",
    "mlx-lm==0.32.2",
    "pulp==3.3.2",
    "highspy==1.16.0",
]

[dependency-groups]
dev = ["pytest>=8", "wandb==0.31.0"]  # wandb: optional training/eval tracking

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nl2opt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs every converted program (about 20 s)"]
